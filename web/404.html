<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="N-Events — Campus Event Hub & Registration Portal">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="N-Events">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>N-Events Campus Portal</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #1E1B4B 0%, #0F172A 70%, #020617 100%);
      color: #FFFFFF;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .loading-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }
    .spinner-ring {
      position: absolute;
      width: 86px;
      height: 86px;
      border: 3px solid rgba(129, 140, 248, 0.15);
      border-top: 3px solid #818CF8;
      border-right: 3px solid #C084FC;
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
    }
    .n-badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 50%, #C084FC 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 36px;
      font-weight: 900;
      color: #FFFFFF;
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
      animation: pulse 1.8s ease-in-out infinite;
      user-select: none;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.96); box-shadow: 0 0 25px rgba(99, 102, 241, 0.4); }
      50% { transform: scale(1.06); box-shadow: 0 0 45px rgba(168, 85, 247, 0.7); }
    }
    .loading-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(90deg, #FFFFFF, #818CF8, #C084FC);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .loading-sub {
      margin-top: 6px;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading">
    <div class="logo-wrapper">
      <div class="spinner-ring"></div>
      <div class="n-badge">Ñ</div>
    </div>
    <div class="loading-title">N-EVENTS</div>
    <div class="loading-sub">CAMPUS PORTAL</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
