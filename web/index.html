<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="N Events — Campus Event Hub & Registration Portal">

  <!-- Performance & Pre-connect optimization -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="N Events">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>N Events Campus Portal</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #1E1B4B 0%, #0F172A 70%, #020617 100%);
      color: #FFFFFF;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .loading-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .logo-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .spinner-ring {
      position: absolute;
      width: 86px;
      height: 86px;
      border: 3.5px solid rgba(129, 140, 248, 0.15);
      border-top: 3.5px solid #818CF8;
      border-right: 3.5px solid #C084FC;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .n-badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 50%, #C084FC 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 36px;
      font-weight: 900;
      color: #FFFFFF;
      box-shadow: 0 0 35px rgba(99, 102, 241, 0.6);
      animation: pulse 1.5s ease-in-out infinite;
      user-select: none;
    }
    .loading-text {
      margin-top: 20px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.7);
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.96); box-shadow: 0 0 30px rgba(99, 102, 241, 0.5); }
      50% { transform: scale(1.05); box-shadow: 0 0 45px rgba(168, 85, 247, 0.8); }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading">
    <div class="logo-wrapper">
      <div class="spinner-ring"></div>
      <div class="n-badge">N</div>
    </div>
    <div class="loading-text">Loading nEvents...</div>
  </div>
  <script>
    function removeLoadingIndicator() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        loading.style.transition = 'opacity 0.3s ease-out';
        setTimeout(function () {
          if (loading && loading.parentNode) {
            loading.parentNode.removeChild(loading);
          }
        }, 300);
      }
    }

    window.addEventListener('flutter-first-frame', removeLoadingIndicator);

    var observer = new MutationObserver(function (mutations) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('flt-renderer')) {
        removeLoadingIndicator();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
