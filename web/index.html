<!DOCTYPE html>
<html>
<head>
  <!-- Placeholder for base href that will be replaced by the value of the `--base-href` argument provided to `flutter build` -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="N-Events — Campus Event Hub & Registration Portal">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="N-Events">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>N-Events Campus Portal</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #1E1B4B 0%, #0F172A 70%, #020617 100%);
      color: #FFFFFF;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .loading-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .spinner-ring {
      position: absolute;
      width: 96px;
      height: 96px;
      border: 3.5px solid rgba(129, 140, 248, 0.15);
      border-top: 3.5px solid #818CF8;
      border-right: 3.5px solid #C084FC;
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
    }
    .n-badge {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 50%, #C084FC 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      font-weight: 900;
      color: #FFFFFF;
      box-shadow: 0 0 35px rgba(99, 102, 241, 0.6);
      animation: pulse 1.8s ease-in-out infinite;
      user-select: none;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.95); box-shadow: 0 0 30px rgba(99, 102, 241, 0.5); }
      50% { transform: scale(1.08); box-shadow: 0 0 50px rgba(168, 85, 247, 0.8); }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading">
    <div class="logo-wrapper">
      <div class="spinner-ring"></div>
      <div class="n-badge">Ñ</div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
